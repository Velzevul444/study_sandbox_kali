<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Хацкер.moc</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="./assets/white_hacker_in_russia-news.png.jpeg">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <path d="M24 4 42 13.5v20.9L24 44 6 34.4V13.5L24 4Z"></path>
            <path d="M15 18.5h18M15 24h18M15 29.5h11" class="brand-mark-lines"></path>
          </svg>
        </div>
        <div>
          <h1>Хацкер.moc</h1>

        </div>
      </div>


    </header>

    <main class="app-shell">
      <section class="workspace" aria-label="Рабочая область">
        <section class="panel editor-panel" aria-labelledby="editorTitle">
          <div class="panel-head">
            <div>
              <span class="eyebrow">Payload</span>
              <h2 id="editorTitle">Редактор</h2>
            </div>
            <button class="ghost-button" id="resetButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                <path d="M3 4v6h6"></path>
              </svg>
              Сброс
            </button>
          </div>

          <div class="control-grid">
            <label class="field">
              <span>Контекст</span>
              <select id="contextSelect">
                <option value="html">HTML body</option>
                <option value="attribute">HTML attribute</option>
                <option value="url">URL href</option>
                <option value="script">Script string</option>
              </select>
            </label>

            <label class="field">
              <span>Защита</span>
              <select id="protectionSelect">
                <option value="vulnerable">Уязвимо</option>
                <option value="escape">Экранирование</option>
                <option value="sanitize">Sanitizer</option>
              </select>
            </label>

            <label class="field">
              <span>Окно</span>
              <select id="viewportSelect">
                <option value="desktop">Desktop</option>
                <option value="tablet">Tablet</option>
                <option value="mobile">Mobile</option>
              </select>
            </label>

            <label class="field">
              <span>Сайт</span>
              <input id="siteUrlInput" type="text" placeholder="https://example.com или /my-site/index.html">
            </label>

            <label class="toggle">
              <input id="scriptsToggle" type="checkbox" checked>
              <span class="toggle-track" aria-hidden="true"></span>
              <span>Скрипты</span>
            </label>
          </div>

          <label class="code-field">
            <span class="visually-hidden">Payload</span>
            <textarea id="payloadInput" spellcheck="false"></textarea>
          </label>

          <div class="action-row">
            <button class="primary-button" id="runButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 5 11 7-11 7V5Z"></path>
              </svg>
              Запустить
            </button>
            <button class="secondary-button" id="copyButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                <rect x="2" y="2" width="13" height="13" rx="2"></rect>
              </svg>
              Копировать
            </button>
            <button class="secondary-button" id="clearLogButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="m19 6-1 14H6L5 6"></path>
                <path d="M10 11v5M14 11v5"></path>
              </svg>
              Журнал
            </button>
          </div>
        </section>

        <section class="panel preview-panel" aria-labelledby="previewTitle">
          <div class="panel-head preview-head">
            <div>
              <span class="eyebrow">Sandbox</span>
              <h2 id="previewTitle">Изолированный просмотр</h2>
            </div>
          </div>

          <div class="browser-shell" id="browserShell">
            <div class="browser-bar" aria-hidden="true">
              <div class="traffic-lights">
                <span></span>
                <span></span>
                <span></span>
              </div>
              <div class="address-bar" id="addressBar">sandbox://xss-lab/frame</div>
            </div>
            <iframe id="previewFrame" title="Изолированный результат payload"></iframe>
          </div>
        </section>
      </section>

      <aside class="side-rail" aria-label="Панели">
        <section class="panel signal-panel" aria-labelledby="signalTitle">
          <div class="panel-head">
            <div>
              <span class="eyebrow">Signals</span>
              <h2 id="signalTitle">События</h2>
            </div>
          </div>

          <div class="surface-map" aria-hidden="true">
            <div class="surface-node node-input">input</div>
            <div class="surface-node node-filter">filter</div>
            <div class="surface-node node-frame">iframe</div>
            <div class="surface-line line-a"></div>
            <div class="surface-line line-b"></div>
          </div>

          <dl class="stats-grid">
            <div>
              <dt>Запуски</dt>
              <dd id="runsStat">0</dd>
            </div>
            <div>
              <dt>Alerts</dt>
              <dd id="alertsStat">0</dd>
            </div>
            <div>
              <dt>Блокировки</dt>
              <dd id="blockedStat">0</dd>
            </div>
            <div>
              <dt>Origin</dt>
              <dd>null</dd>
            </div>
          </dl>
        </section>

        <section class="panel library-panel" aria-labelledby="libraryTitle">
          <div class="panel-head">
            <div>
              <span class="eyebrow">Library</span>
              <h2 id="libraryTitle">Примеры</h2>
            </div>
          </div>
          <div class="preset-list" id="presetList"></div>
        </section>

        <section class="panel log-panel" aria-labelledby="logTitle">
          <div class="panel-head">
            <div>
              <span class="eyebrow">Runtime</span>
              <h2 id="logTitle">Журнал</h2>
            </div>
          </div>
          <ol class="event-log" id="eventLog"></ol>
        </section>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
